<form id="ff-validation" class="ff-form " data-ff-form data-ff-demo novalidate><div class="ff-row"><div class="ff-field " data-required ><label class="ff-label" for="v-user">Username<span class="ff-req" aria-hidden="true">*</span></label><input class="ff-c" id="v-user" name="username" type="text" placeholder="" required minlength=3 maxlength=16 data-rule=noSpaces><p class="ff-help">3–16 characters, no spaces.</p><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " data-required ><label class="ff-label" for="v-email">Email<span class="ff-req" aria-hidden="true">*</span></label><input class="ff-c" id="v-email" name="email" type="email" placeholder="" required><p class="ff-error" role="alert" hidden></p></div></div><div class="ff-row"><div class="ff-field " data-required ><label class="ff-label" for="v-age">Age<span class="ff-req" aria-hidden="true">*</span></label><div class="ff-wrap" data-ff="number"><input class="ff-c" id="v-age" name="age" type="number" min=18 max=99 required><span class="ff-adorn"><button class="ff-ibtn" type="button" data-dir="-1" aria-label="Decrease">−</button><button class="ff-ibtn" type="button" data-dir="1" aria-label="Increase">+</button></span></div><p class="ff-help">Between 18 and 99.</p><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " ><label class="ff-label" for="v-url">Website</label><input class="ff-c" id="v-url" name="url" type="url" placeholder="https://" ><p class="ff-help">Optional URL.</p><p class="ff-error" role="alert" hidden></p></div></div><div class="ff-field " data-required ><label class="ff-label" for="v-zip">Postal code<span class="ff-req" aria-hidden="true">*</span></label><input class="ff-c" id="v-zip" name="zip" type="text" placeholder="" required pattern="[0-9]{5}" data-pattern-message="Use exactly 5 digits."><p class="ff-error" role="alert" hidden></p></div><div class="ff-actions"><button class="btn btn-primary" type="submit">Validate</button><button class="btn" type="button" data-ff-server-error>Simulate server (422) errors</button><button class="btn" type="button" data-ff-reset>Reset</button></div></form>
