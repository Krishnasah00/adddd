p-i" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4"><input class="ff-c ff-otp-i" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5"><input class="ff-c ff-otp-i" type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6"><input type="hidden" name="otp" data-ff-value></div><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " data-ff-name="colour" ><label class="ff-label" for="">Colour</label><div class="ff-color" data-ff="color"><input type="color" value="#4f46e5" aria-label="Pick colour"><input class="ff-c" type="text" name="colour" value="#4f46e5" style="width:110px" aria-label="Hex colour"><button class="ff-sw" type="button" data-color="#4f46e5" style="background:#4f46e5" aria-label="Use #4f46e5"></button><button class="ff-sw" type="button" data-color="#2563eb" style="background:#2563eb" aria-label="Use #2563eb"></button><button class="ff-sw" type="button" data-color="#16a34a" style="background:#16a34a" aria-label="Use #16a34a"></button><button class="ff-sw" type="button" data-color="#e11d48" style="background:#e11d48" aria-label="Use #e11d48"></button><button class="ff-sw" type="button" data-color="#ea580c" style="background:#ea580c" aria-label="Use #ea580c"></button></div><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " ><label class="ff-label" for="g-img">Image upload</label><div data-ff="file" data-ff-mode=image><div class="ff-drop" tabindex="0" role="button" aria-label="Upload an image"><strong>Upload an image</strong><span>Click or drag files here</span></div><input id="g-img" type="file" name="image" hidden  accept=image/*><ul class="ff-files"></ul></div><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " ><label class="ff-label" for="g-files">Multiple files</label><div data-ff="file"><div class="ff-drop" tabindex="0" role="button" aria-label="Upload files"><strong>Upload files</strong><span>Click or drag files here</span></div><input id="g-files" typ
