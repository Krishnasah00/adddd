<section class="card" id="td-preview" style="margin-bottom:16px"><h2>Live Preview</h2><p class="muted">Uses the real toast system. Nothing is shown until you click a button or submit the test form.</p><form id="td-form" class="td-controls"><label class="td-field" for="td-position">Position<select id="td-position"><option value="top-left">Top Left</option><option value="top-center">Top Center</option><option value="top-right" selected>Top Right</option><option value="center">Center</option><option value="bottom-left">Bottom Left</option><option value="bottom-center">Bottom Center</option><option value="bottom-right">Bottom Right</option></select></label><label class="td-field" for="td-theme">Theme<select id="td-theme"><option value="auto" selected>Auto (dashboard)</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label class="td-field" for="td-duration">Duration<select id="td-duration"><option value="2000">2 seconds</option><option value="3000">3 seconds</option><option value="4000" selected>4 seconds</option><option value="5000">5 seconds</option><option value="10000">10 seconds</option><option value="false">Persistent</option></select></label><label class="td-field" for="td-max">Max visible<select id="td-max"><option value="3">3</option><option value="5" selected>5</option><option value="8">8</option></select></label><label class="td-field" for="td-type">Test type<select id="td-type"><option value="success" selected>Success</option><option value="error">Error</option><option value="warning">Warning</option><option value="info">Information</option><option value="loading">Loading</option></select></label><label class="td-field" for="td-title">Custom title<input id="td-title" type="text" placeholder="Optional title"></label><label class="td-field" for="td-message">Custom message<input id="td-message" type="text" placeholder="Optional message"></label><label class="td-field" for="td-desc">Description<input id="td-desc" type="text" placeholder="Optional description"></label><label class="td-check"><input type="checkbox" id="td-progress" checked> Progress bar</label><label class="td-check"><input type="checkbox" id="td-close" checked> Close button</label><label class="td-check"><input type="checkbox" id="td-hover" checked> Pause on hover</label><button class="btn btn-primary" type="submit">Show test toast</button></form><div class="td-grid"><button class="btn" type="button" data-demo="success">Success Notification</button><button class="btn" type="button" data-demo="error">Error Notification</button><button class="btn" type="button" data-demo="warning">Warning Notification</button><button class="btn" type="button" data-demo="info">Information Notification</button><button class="btn" type="button" data-demo="loading">Loading Notification</button><button class="btn" type="button" data-demo="loading-success">Loading → Success</button><button class="btn" type="button" data-demo="loading-error">Loading → Error</button><button class="btn" type="button" data-demo="promise">Promise Notification</button><button class="btn" type="button" data-demo="promise-error">Promise → Error</button><button class="btn" type="button" data-demo="persistent">Persistent Notification</button><button class="btn" type="button" data-demo="duration">Custom Duration</button><button class="btn" type="button" data-demo="position">Custom Position</button><button class="btn" type="button" data-demo="light">Light Theme</button><button class="btn" type="button" data-demo="dark">Dark Theme</button><button class="btn" type="button" data-demo="multiple">Multiple Notifications</button><button class="btn" type="button" data-demo="queue">Queue Test (8 toasts)</button><button class="btn" type="button" data-demo="duplicate">Duplicate Prevention</button><button class="btn" type="button" data-demo="clear">Clear All Notifications</button></div><p class="muted" id="td-status" aria-live="polite"></p></section>
