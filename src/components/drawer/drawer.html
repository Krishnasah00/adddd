<template id="tpl-dr-basic" data-title="Basic drawer"><div data-slot="body"><p>A general-purpose side panel. Press Escape, click the backdrop or use the close button to dismiss it.</p><p class="muted">The body scrolls independently when the content is long.</p></div><div data-slot="footer"><button class="btn btn-primary" type="button" data-drawer-close>Got it</button></div></template><template id="tpl-dr-nav" data-title="Navigation drawer"><div data-slot="body"><ul class="cx-list"><li><a href="index.html">Dashboard</a></li><li><a href="users.html">Users</a></li><li><a href="products.html">Products</a></li><li><a href="orders.html">Orders</a></li><li><a href="analytics.html">Analytics</a></li><li><a href="appearance.html">Appearance</a></li></ul></div></template><template id="tpl-dr-filter" data-title="Filters"><div data-slot="body"><form id="dr-filter-form" class="ff-form " data-ff-form novalidate><div class="ff-field " ><label class="ff-label" for="dr-f-status">Status</label><select class="ff-c" id="dr-f-status" name="status" ><option value="">Any status</option><option value="Active">Active</option><option value="Invited">Invited</option><option value="Suspended">Suspended</option></select><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " ><label class="ff-label" for="dr-f-role">Role</label><div class="ff-ms" data-ff="multiselect"><button class="ff-ms-trigger" type="button" id="dr-f-role" aria-haspopup="listbox" data-placeholder="Select options..."></button><div class="ff-pop" role="listbox" hidden><label class="ff-opt"><input type="checkbox" value="Admin"> Admin</label><label class="ff-opt"><input type="checkbox" value="Editor"> Editor</label><label class="ff-opt"><input type="checkbox" value="Support"> Support</label><label class="ff-opt"><input type="checkbox" value="Viewer"> Viewer</label></div><input type="hidden" name="roles" data-ff-value data-ff-type="array" value="[]"></div><p class="ff-error" role="alert" hidden></p></div><div class="ff-field" data-ff-name="verified"><label class="ff-check"><input type="checkbox" name="verified" value="on" > Verified accounts only</label></div><div class="ff-field" data-ff-name="recent"><label class="ff-switch"><span>Joined in the last 30 days</span><input type="checkbox" role="switch" name="recent" ></label></div><div class="ff-actions"></div></form></div><div data-slot="footer"><button class="btn" type="button" data-dr-reset>Reset</button><button class="btn btn-primary" type="button" data-dr-apply>Apply filters</button></div></template><template id="tpl-dr-form" data-title="Quick create user"><div data-slot="body"><form id="dr-user-form" class="ff-form " data-ff-form novalidate><div class="ff-field " data-required ><label class="ff-label" for="dr-u-name">Full name<span class="ff-req" aria-hidden="true">*</span></label><input class="ff-c" id="dr-u-name" name="name" type="text" placeholder="" required><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " data-required ><label class="ff-label" for="dr-u-email">Email<span class="ff-req" aria-hidden="true">*</span></label><input class="ff-c" id="dr-u-email" name="email" type="email" placeholder="" required><p class="ff-help">We will never share it.</p><p class="ff-error" role="alert" hidden></p></div><div class="ff-field " data-required ><label class="ff-label" for="dr-u-role">Role<span class="ff-req" aria-hidden="true">*</span></label><select class="ff-c" id="dr-u-role" name="role" required><option value="">Choose a role</option><option value="Admin">Admin</option><option value="Editor">Editor</option><option value="Viewer">Viewer</option></select><p class="ff-error" role="alert" hidden></p></div><div class="ff-actions"></div></form></div><div data-slot="footer"><button class="btn" type="button" data-drawer-close>Cancel</button><button class="btn btn-primary" type="submit" form="dr-user-form">Create user</button></div></template><template id="tpl-dr-action" data-title="Item actions"><div data-slot="body"><p>Choose what to do with <strong>Order #10482</strong>.</p><div class="cx-stack"><button class="btn" type="button" data-dr-archive>Archive item</button><button class="btn" type="button" data-drawer-close>Keep as is</button></div></div><div data-slot="footer"><button class="btn btn-danger" type="button" data-dr-delete>Delete…</button></div></template>
